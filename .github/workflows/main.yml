name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Unzip sources
        run: |
          Z=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          echo "Found zip: $Z"
          if [ -z "$Z" ]; then ls -R | head -40; exit 1; fi
          unzip -q "$Z" -d unpacked
      - run: gradle build --no-daemon
        working-directory: unpacked/dex-visual
      - uses: actions/upload-artifact@v4
        with:
          name: DEX-VISUAL
          path: unpacked/dex-visual/build/libs/dex-visual-1.0.0.jar
