name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Assemble project from flat files
        run: |
          D=proj/src/main/java/uz/dexvisual
          mkdir -p $D/mixin proj/src/main/resources/assets/dexvisual/lang
          rm -f DexScreen.java Modules.java DexVisualClient.java
          mv EntityMixin.java GameRendererMixin.java SimpleOptionAccessor.java $D/mixin/
          mv *.java $D/
          mv fabric.mod.json dexvisual.mixins.json proj/src/main/resources/
          mv en_us.json proj/src/main/resources/assets/dexvisual/lang/
          mv build.gradle settings.gradle gradle.properties proj/
          find proj -type f | sort
      - run: gradle build --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: DEX-VISUAL
          path: proj/build/libs/dex-visual-1.0.0.jar
